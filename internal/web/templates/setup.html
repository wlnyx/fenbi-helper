<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>粉笔刷题助手 · 登录</title>
<link rel="stylesheet" href="/static/styles.css">
</head>
<body class="login-body">
<div class="qr-card">
    <div class="qr-logo">📚</div>
    <div class="qr-title">粉笔刷题助手</div>
    <div class="qr-subtitle">扫码登录 · 六步复盘工作台</div>
    <div class="qr-img-box" id="qrBox">
        <div class="qr-loading" id="qrLoading">
            <div class="qr-spinner"></div>
            <span>正在获取二维码...</span>
        </div>
        <img id="qrImg" src="" alt="二维码" style="display:none;">
    </div>
    <div class="qr-msg" id="qrMsg">正在连接粉笔...</div>
    <button id="qrRetry" type="button" class="qr-btn">二维码已失效，点击重新生成</button>
    <div class="qr-tip">打开粉笔 App → 右上角「扫一扫」</div>
</div>
<script>
var qrPollTimer = null;

function stopQrPoll() {
    if (qrPollTimer) { clearInterval(qrPollTimer); qrPollTimer = null; }
}

function showQr(src) {
    document.getElementById("qrLoading").style.display = 'none';
    var img = document.getElementById("qrImg");
    img.src = src;
    img.style.display = 'block';
    document.getElementById("qrBox").classList.add('has-qr');
}

function startQrLogin() {
    var msg = document.getElementById("qrMsg");
    var retry = document.getElementById("qrRetry");
    var img = document.getElementById("qrImg");
    img.style.display = 'none';
    document.getElementById("qrLoading").style.display = '';
    document.getElementById("qrBox").classList.remove('has-qr');
    msg.textContent = '正在连接粉笔...';
    retry.style.display = 'none';
    fetch('/api/qr/start', { method: 'POST', headers: { 'content-type': 'application/json' } })
        .then(function (r) { return r.json(); })
        .then(function (result) {
            if (result.code !== 200) {
                msg.textContent = '获取二维码失败：' + (result.msg || '');
                document.getElementById("qrLoading").style.display = 'none';
                retry.style.display = 'inline-block';
                return;
            }
            showQr('/api/qr.png?t=' + Date.now());
            msg.textContent = '请用粉笔App扫描二维码';
            pollQrStatus();
        })
        .catch(function () {
            msg.textContent = '请求失败，请重试';
            document.getElementById("qrLoading").style.display = 'none';
            retry.style.display = 'inline-block';
        });
}

function pollQrStatus() {
    stopQrPoll();
    qrPollTimer = setInterval(function () {
        fetch('/api/qr/status').then(function (r) { return r.json(); }).then(function (s) {
            var msg = document.getElementById("qrMsg");
            var retry = document.getElementById("qrRetry");
            if (s.state === 'waiting') {
                msg.textContent = '请用粉笔App扫描二维码';
            } else if (s.state === 'scanned') {
                msg.textContent = '已扫码，请在手机上确认';
            } else if (s.state === 'authorized') {
                stopQrPoll();
                msg.textContent = '登录成功，正在写入 Cookie...';
                fetch('/api/qr/finish', { method: 'POST', headers: { 'content-type': 'application/json' } })
                    .then(function (r) { return r.json(); })
                    .then(function (f) {
                        if (f.code !== 200) {
                            msg.textContent = '登录失败：' + (f.msg || '');
                            retry.style.display = 'inline-block';
                            return;
                        }
                        return fetch('/api/session/apply', { method: 'POST' }).then(function (r) { return r.json(); });
                    })
                    .then(function (a) {
                        if (a && a.code === 200) { window.location = a.redirectPath; }
                    });
            } else if (s.state === 'expired' || s.state === 'canceled') {
                stopQrPoll();
                msg.textContent = s.msg + '，正在重新生成...';
                startQrLogin();
            } else {
                stopQrPoll();
                msg.textContent = s.msg || '状态获取失败';
                document.getElementById("qrLoading").style.display = 'none';
                retry.style.display = 'inline-block';
            }
        });
    }, 2000);
}

document.getElementById("qrRetry").addEventListener('click', startQrLogin);
startQrLogin();
</script>
</body>
</html>
