<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>练习历史 · 粉笔工作台</title>
<link rel="stylesheet" href="/static/styles.css">
<style>
    .his-item {
        display: flex; align-items: center; gap: 12px;
        padding: 14px 16px;
        background: var(--bg-card);
        border-radius: var(--radius);
        box-shadow: var(--shadow-card);
        margin-bottom: 12px;
        cursor: pointer;
        transition: all .15s;
    }
    .his-item:hover { box-shadow: var(--shadow-lift); transform: translateY(-1px); }
    .his-title { font-size: 14px; color: var(--text-1); flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .his-time { font-size: 12px; color: var(--text-3); white-space: nowrap; }
    .tag {
        background: var(--fb-blue-light); color: var(--fb-blue);
        border-radius: 4px; padding: 2px 8px;
        font-size: 12px; white-space: nowrap;
    }
    .tag-green { background: #f6ffed; color: var(--success); }
    .tag-orange { background: #fffbe6; color: var(--warning); }
</style>
</head>
<body>
{{template "nav" .}}
<main class="content">
    <h1 class="page-title">练习历史</h1>
    {{if not .History}}
    <div class="empty-state">暂无练习记录</div>
    {{else}}
    {{range .History}}
    <div class="his-item" onclick="window.location='/exercise/{{.ID}}'">
        <span class="his-title">{{.Sheet.Name}}</span>
        <span class="tag">做了{{.AnswerCount}}题</span>
        {{if .ElapsedTime}}<span class="tag">耗时{{.ElapsedTime}}s</span>{{end}}
        {{if gt .CorrectRate 0.0}}<span class="tag tag-green">正确率{{printf "%.1f" .CorrectRate}}%</span>{{end}}
        <span class="his-time">{{.Client}}</span>
    </div>
    {{end}}
    {{end}}
</main>
</body>
</html>
